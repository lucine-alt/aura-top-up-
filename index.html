<head>

<style>
*{box-sizing:border-box}
body{

}
.container{

 background:#20152f;border:1px solid #50356c;
 border-radius:22px;box-shadow:0 12px 40px #0008;

.logo{text-align:center;margin-bottom:22px}
.logo h1{margin:0;color:#d5a5ff;font-size:30px;letter-spacing:2px}

h2{font-size:19px}
h3{font-size:16px}
.subtitle{text-align:center;color:#bbaaca;font-size:14px}
button,input,select{font:inherit}
.login-btn{
 width:100%;height:49px;margin:7px 0;border:0;
 border-radius:12px;display:flex;align-items:center;
 justify-content:center;gap:12px;font-size:15px;

.google{background:#fff;color:#222}
.facebook{background:#1877f2;color:white}
.phone{background:#8b5cf6;color:white}
.login-btn img{width:22px;height:22px}

.divider{

}
input,select{

}
input:focus,select:focus{border-color:#bd82ff}
input::placeholder{color:#aa9ab9}
.action{
 width:100%;height:47px;margin:8px 0;border:0;
 border-radius:11px;
 background:linear-gradient(90deg,#a855f7,#7c3aed);
 color:white;font-weight:bold;cursor:pointer;
}
#recaptcha-container{margin:12px 0}
#userProfile{
 display:none;text-align:center;padding:16px;
 background:#30213f;border-radius:14px;margin-bottom:18px;
}
#userPhoto{
 width:65px;height:65px;border-radius:50%;
 object-fit:cover;border:2px solid #c084fc;
}
#userEmail{color:#bdaaca;font-size:13px}
.logout{background:#49354f}
.section{
 margin-top:20px;padding-top:15px;
 border-top:1px solid #49365c;
}
.price{
 color:#d8a5ff;font-weight:bold;text-align:center;
 font-size:17px;padding:12px;background:#30213f;
 border-radius:10px;
}
.note{font-size:12px;color:#a998b8;text-align:center}
#message{color:#d5a5ff;text-align:center;overflow-wrap:anywhere}

<body>
<div class="container">

<div class="logo">
<h1>✦ AURA TOP UP</h1>
<p>MOBILE LEGENDS • DIAMOND STORE</p>
</div>

<div id="loginArea">
<p class="subtitle">Login to your account</p>

Continue with Google

Continue with Facebook

placeholder="Enter 6-digit OTP">

<div id="userProfile">
<img id="userPhoto" alt="Profile">
<h3 id="userName">User</h3>
<p id="userEmail"></p>
<button class="action logout" onclick="auraLogout()">Logout</button>
</div>

<div class="section">
<h2>💎 Diamond Top Up</h2>

<label>Player ID</label>
<input id="playerID" placeholder="Player ID">

<label>Server ID</label>
<input id="serverID" placeholder="Server ID">

<label>Select Product</label>
<select id="product" onchange="showPrice()">
<option value="">Select Product</option>
<option value="7900">Weekly Pass - 7,900 MMK</option>
<option value="2550">86 Diamonds - 2,550 MMK</option>
<option value="4800">172 Diamonds - 4,800 MMK</option>
<option value="8000">257 Diamonds - 8,000 MMK</option>
</select>

<div class="price" id="price">Price: 0 MMK</div>

<label>Payment Method (Demo)</label>
<select id="paymentMethod">
<option value="">Select Payment Method</option>
<option value="KBZPay">KBZPay</option>
<option value="WavePay">WavePay</option>
</select>

<label>Fake Transaction ID (Demo Only)</label>
<input id="transactionID" type="text"
placeholder="Enter fake test ID">

<button type="button" class="action" onclick="demoOrder()">
Confirm Demo Order
</button>

<p id="message"></p>
<p class="note">Demo Order Only • No Real Payment</p>
</div>
</div>

<script>
function showPrice(){
 const p=document.getElementById("product");
 document.getElementById("price").textContent=
 "Price: "+(Number(p.value)||0).toLocaleString()+" MMK";
}

window.demoOrder=async function(){
 const player=document.getElementById("playerID").value.trim();
 const server=document.getElementById("serverID").value.trim();
 const product=document.getElementById("product");
 const payment=document.getElementById("paymentMethod").value;
 const transaction=document.getElementById("transactionID").value.trim();
 const message=document.getElementById("message");

 if(!player||!server||!product.value||!payment||!transaction){
  alert("Please fill all fields!");
  return;
 }

 if(typeof window.auraSaveOrder!=="function"){
  message.textContent="Firebase is not ready. Please reload the page.";
  return;
 }

 message.textContent="Saving demo order...";

 try{
  const order={
   playerID:player,
   serverID:server,
   product:product.options[product.selectedIndex].text,
   price:Number(product.value),
   paymentMethod:payment,
   transactionID:transaction,
   status:"Pending",
   createdAt:new Date().toISOString()
  };

  const result=await window.auraSaveOrder(order);
  message.textContent="Demo Order Saved! ID: "+result.id;

 }catch(error){
  console.error(error);
  message.textContent="Order Save Failed: "+error.message;
 }
};
</script>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
 getAuth,GoogleAuthProvider,FacebookAuthProvider,
 signInWithPopup,signOut,onAuthStateChanged,
 RecaptchaVerifier,signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 doc,

const firebaseConfig={
 apiKey:"AIzaSyDkCgqgLy2GC_kNbReVdzUnyULYnNEYjkI",
 authDomain:"aura-top-up-fd609.firebaseapp.com",
 projectId:"aura-top-up-fd609",

 messagingSenderId:"822916904997",
 appId:"1:822916904997:web:c6de6a6ace7059f6e527cc",
 measurementId:"G-F1JJT3P1VQ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
window.auraFirebaseReady = true;
console.log("AURA Firebase Ready");
const googleProvider=new GoogleAuthProvider();
const facebookProvider=new FacebookAuthProvider();

window.auraSaveOrder=async(order)=>{
 if(!auth.currentUser){
  throw new Error("Please login first.");
 }
 return await addDoc(collection(db,"Orders"),order);
};

window.auraLoadAdminOrders = async () => {
  const adminEmail = "ak0061266@gmail.com";
  const user = auth.currentUser;

  if (!user || user.email !== adminEmail) {
    alert("Admin access only!");
    return;
  }

  const dashboard = document.getElementById("adminDashboard");
  const list = document.getElementById("ordersList");

  dashboard.style.display = "block";
  list.textContent = "Loading Orders...";

  try {
    const snapshot = await getDocs(collection(db, "Orders"));
    list.replaceChildren();

    if (snapshot.empty) {
      list.textContent = "No Orders Yet";
      return;
    }

    snapshot.forEach((orderDoc) => {
      const order = orderDoc.data();
      const item = document.createElement("div");
      const info = document.createElement("p");

      info.textContent =
        "Order ID: " + orderDoc.id +
        " | Player: " + order.playerID +
        " | Server: " + order.serverID +
        " | Product: " + order.product +
        " | Price: " + order.price +
        " MMK | Status: " + order.status;

      item.appendChild(info);

      const btn = document.createElement("button");
      btn.textContent = "Mark Completed";

      btn.onclick = async () => {
        try {
          await updateDoc(doc(db, "Orders", orderDoc.id), {
            status: "Completed"
          });
          alert("Order Completed!");
          window.auraLoadAdminOrders();
        } catch (error) {
          alert("Update Failed: " + error.message);
        }
      };

      item.appendChild(btn);
      list.appendChild(item);
    });
  } catch (error) {
    list.textContent = "Error: " + error.message;
  }
};

window.auraGoogleLogin=async()=>{
 try{
  await signInWithPopup(auth,googleProvider);
 }catch(e){
  alert("Google Login: "+e.message);
 }
};

window.auraFacebookLogin=async()=>{
 try{
  await signInWithPopup(auth,facebookProvider);
 }catch(e){
  alert("Facebook Login: "+e.message);
 }
};

      item.appendChild(btn);
      list.appendChild(item);
    });

  } catch (error) {
    list.textContent = "Error: " + error.message;
  }
};

let confirmationResult=null;
let recaptchaVerifier=null;

window.sendOTP=async()=>{
 try{
  const phone=document.getElementById("phoneNumber").value.trim();

  if(!phone.startsWith("+")){
   alert("Country code ထည့်ပါ။ ဥပမာ +959xxxxxxxxx");
   return;
  }

  if(!recaptchaVerifier){
   recaptchaVerifier=new RecaptchaVerifier(
    auth,"recaptcha-container",{size:"normal"}
   );
  }

  confirmationResult=await signInWithPhoneNumber(
   auth,phone,recaptchaVerifier
  );

  alert("OTP ပို့ပြီးပါပြီ။");

 }catch(e){
  alert("Phone Error: "+e.message);

  if(recaptchaVerifier){
   recaptchaVerifier.clear();
   recaptchaVerifier=null;
  }
 }
};

window.verifyOTP=async()=>{
 try{
  const code=document.getElementById("otpCode").value.trim();

  if(!confirmationResult||!code){
   alert("OTP Code ထည့်ပါ။");
   return;
  }

  await confirmationResult.confirm(code);
  alert("Phone Login Success!");

 }catch(e){
  alert("OTP Error: "+e.message);
 }
};

window.auraLogout=async()=>{
 try{
  await signOut(auth);
 }catch(e){
  alert(e.message);
 }
};

onAuthStateChanged(auth,user=>{
 const profile=document.getElementById("userProfile");
 const login=document.getElementById("loginArea");

 if(user){
  profile.style.display="block";
  login.style.display="none";

  document.getElementById("userName").textContent=
   user.displayName||"User";

  document.getElementById("userEmail").textContent=
   user.email||user.phoneNumber||"";

  document.getElementById("userPhoto").src=
   user.photoURL||"https://www.gravatar.com/avatar/?d=mp";

 }else{
  profile.style.display="none";
  login.style.display="block";
 }
});
</script>
